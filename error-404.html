<!doctype html>
<html lang="zxx">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <!-- Title -->
    <title>RockChain Technologies- IT Solutions & Business Services</title>

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="RockChain Technologies delivers enterprise-grade IT solutions, custom software development, cloud services, and digital transformation for businesses worldwide."
    />
    <meta
      name="keywords"
      content="IT solutions, software development, web development, mobile apps, cloud services, digital transformation, IT consulting, business automation, RockChain Technologies"
    />
    <meta name="author" content="RockChain Technologies" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rockchain.in/" />
    <meta
      property="og:title"
      content="RockChain Technologies - IT Solutions & Business Services"
    />
    <meta
      property="og:description"
      content="Expert IT Solutions For Today's Business Challenges. We build applications, business software, automation systems and digital infrastructure."
    />
    <meta property="og:image" content="https://rockchain.in/images/hero.png" />
    <meta property="og:site_name" content="RockChain Technologies" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://rockchain.in/" />
    <meta
      property="twitter:title"
      content="RockChain Technologies - IT Solutions & Business Services"
    />
    <meta
      property="twitter:description"
      content="Expert IT Solutions For Today's Business Challenges. We build applications, business software, automation systems and digital infrastructure."
    />
    <meta
      property="twitter:image"
      content="https://rockchain.in/images/hero.png"
    />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://rockchain.in/" />

    <!-- Favicon and Touch Icons -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="images/logo/favicon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="images/logo/favicon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="images/logo/favicon.png"
    />

    <!-- Theme Color -->
    <meta name="theme-color" content="#2563eb" />
    <meta name="msapplication-TileColor" content="#2563eb" />

    <!-- Geo Tags -->
    <meta name="geo.region" content="IN" />
    <meta name="geo.placename" content="India" />
    <meta name="geo.position" content="20.5937;78.9629" />
    <meta name="ICBM" content="20.5937, 78.9629" />

    <!-- Business Contact -->
    <meta name="business:contact_data:street_address" content="" />
    <meta name="business:contact_data:locality" content="India" />
    <meta name="business:contact_data:postal_code" content="" />
    <meta name="business:contact_data:country_name" content="India" />

    <!-- Verification Tags (Add your site verification codes here) -->
    <!-- <meta name="google-site-verification" content="YOUR_VERIFICATION_CODE" />
    <meta name="msvalidate.01" content="YOUR_VERIFICATION_CODE" /> -->

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;500;600;700;800;900&amp;display=swap"
      rel="stylesheet"
    />
    <!-- SEO Meta Tags Component -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        fetch("components/seo-head.html")
          .then((response) => response.text())
          .then((data) => {
            const head = document.querySelector("head");
            head.insertAdjacentHTML("beforeend", data);
          })
          .catch((error) => console.error("Error loading SEO tags:", error));
      });
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/logo/favicon.png" />
    <!-- Bootstrap Min CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <!-- Animate Min CSS -->
    <link rel="stylesheet" href="css/animate.min.css" />
    <!-- FlatIcon CSS -->
    <link rel="stylesheet" href="css/flaticon.css" />
    <!-- Bootstrap Icon CSS -->
    <link rel="stylesheet" href="css/bootstrap-icons.css" />
    <!-- Font Awesome Min CSS -->
    <link rel="stylesheet" href="css/fontawesome.min.css" />
    <!-- Mean Menu CSS -->
    <link rel="stylesheet" href="css/meanmenu.css" />
    <!-- Magnific Popup Min CSS -->
    <link rel="stylesheet" href="css/magnific-popup.min.css" />
    <!-- Owl Carousel Min CSS -->
    <link rel="stylesheet" href="css/owl.carousel.min.css" />
    <!-- Style CSS -->
    <link rel="stylesheet" href="css/style.css" />
    <!-- Responsive CSS -->
    <link rel="stylesheet" href="css/responsive.css" />

  <body>
    <!-- Start Preloader Section -->
    <div class="preloader">
      <div class="loader-outter"></div>

    <!-- End Preloader Section -->

    <!-- Start Error Section -->
    <section class="error-area">
      <div class="d-table">
        <div class="d-table-cell">
          <div class="container">
            <div class="error-content">
              <img src="images/404.png" alt="error" />

                The page you are looking for might have been removed had its
                name changed or is temporarily unavailable.
              </p>
              <a href="index.html" class="default-btn-one">Go to Home</a>
            </div>
          </div>
        </div>
      </div>
    </section>
    <!-- End Error Section -->

    <!-- Footer will be loaded dynamically -->
    <div id="footer-placeholder"></div>

    <!-- jQuery Min JS -->
    <script src="js/jquery.min.js"></script>
    <!-- Popper Min JS -->
